<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="warehouse-title">
  <title id="warehouse-title">A warehouse with roll-up doors, stacked boxes and a forklift</title>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- sky + ground -->
    <rect width="480" height="360" fill="#f4efe6"/>
    <rect x="0" y="262" width="480" height="98" fill="#ebe4d6"/>
    <line x1="0" y1="262" x2="480" y2="262" stroke="#141414" stroke-width="3"/>
    <line x1="0" y1="318" x2="480" y2="318" stroke="#141414" stroke-width="2" stroke-dasharray="18 14" opacity=".3"/>

    <!-- sun + cloud -->
    <circle cx="96" cy="70" r="24" fill="#ffe94d" stroke="#141414" stroke-width="3"/>
    <path d="M326 88 a14 14 0 0 1 14 -22 a18 18 0 0 1 36 -2 a14 14 0 0 1 22 24 z" fill="#fff" stroke="#141414" stroke-width="3"/>

    <!-- building -->
    <rect x="60" y="132" width="360" height="130" fill="#fff" stroke="#141414" stroke-width="3"/>
    <g stroke="#d9d2c4" stroke-width="2">
      <line x1="66" y1="144" x2="414" y2="144"/>
      <line x1="66" y1="154" x2="414" y2="154"/>
      <line x1="66" y1="164" x2="414" y2="164"/>
    </g>
    <!-- sawtooth roof -->
    <path d="M60 132 L180 90 V132 Z M180 132 L300 90 V132 Z M300 132 L420 90 V132 Z" fill="#2b4cff" stroke="#141414" stroke-width="3"/>
    <!-- flag -->
    <line x1="420" y1="90" x2="420" y2="46" stroke="#141414" stroke-width="3"/>
    <path d="M420 46 L452 56 L420 66 Z" fill="#ff3d8a" stroke="#141414" stroke-width="2"/>
    <!-- sign -->
    <rect x="216" y="140" width="48" height="22" fill="#ff3d8a" stroke="#141414" stroke-width="2" transform="rotate(-3 240 151)"/>

    <!-- door 1 (closed) -->
    <rect x="84" y="182" width="80" height="80" fill="#ebe4d6" stroke="#141414" stroke-width="3"/>
    <g stroke="#141414" stroke-width="1.5" opacity=".35">
      <line x1="86" y1="192" x2="162" y2="192"/><line x1="86" y1="202" x2="162" y2="202"/>
      <line x1="86" y1="212" x2="162" y2="212"/><line x1="86" y1="222" x2="162" y2="222"/>
      <line x1="86" y1="232" x2="162" y2="232"/><line x1="86" y1="242" x2="162" y2="242"/>
      <line x1="86" y1="252" x2="162" y2="252"/>
    </g>

    <!-- door 2 (open, shelves inside) -->
    <rect x="200" y="182" width="80" height="80" fill="#141414" stroke="#141414" stroke-width="3"/>
    <rect x="206" y="212" width="68" height="3" fill="#f4efe6"/>
    <rect x="206" y="238" width="68" height="3" fill="#f4efe6"/>
    <rect x="210" y="198" width="16" height="14" fill="#ff5c1a"/>
    <rect x="232" y="200" width="14" height="12" fill="#ffe94d"/>
    <rect x="254" y="196" width="18" height="16" fill="#e9c27e"/>
    <rect x="212" y="224" width="20" height="14" fill="#e9c27e"/>
    <rect x="240" y="226" width="14" height="12" fill="#ff3d8a"/>
    <rect x="258" y="222" width="14" height="16" fill="#ff5c1a"/>
    <rect x="214" y="248" width="22" height="14" fill="#e9c27e"/>
    <rect x="250" y="250" width="18" height="12" fill="#ffe94d"/>
    <rect x="198" y="180" width="84" height="14" rx="5" fill="#ebe4d6" stroke="#141414" stroke-width="3"/>

    <!-- door 3 (closed) -->
    <rect x="316" y="182" width="80" height="80" fill="#ebe4d6" stroke="#141414" stroke-width="3"/>
    <g stroke="#141414" stroke-width="1.5" opacity=".35">
      <line x1="318" y1="192" x2="394" y2="192"/><line x1="318" y1="202" x2="394" y2="202"/>
      <line x1="318" y1="212" x2="394" y2="212"/><line x1="318" y1="222" x2="394" y2="222"/>
      <line x1="318" y1="232" x2="394" y2="232"/><line x1="318" y1="242" x2="394" y2="242"/>
      <line x1="318" y1="252" x2="394" y2="252"/>
    </g>

    <!-- stacked boxes -->
    <rect x="118" y="248" width="36" height="30" fill="#e9c27e" stroke="#141414" stroke-width="3"/>
    <line x1="136" y1="250" x2="136" y2="276" stroke="#ff3d8a" stroke-width="4"/>
    <rect x="156" y="248" width="36" height="30" fill="#e9c27e" stroke="#141414" stroke-width="3"/>
    <line x1="174" y1="250" x2="174" y2="276" stroke="#ff3d8a" stroke-width="4"/>
    <rect x="137" y="218" width="36" height="30" fill="#e9c27e" stroke="#141414" stroke-width="3"/>
    <line x1="155" y1="220" x2="155" y2="246" stroke="#ff3d8a" stroke-width="4"/>

    <!-- forklift -->
    <rect x="334" y="202" width="42" height="34" fill="none" stroke="#141414" stroke-width="3"/>
    <circle cx="355" cy="218" r="8" fill="#fff" stroke="#141414" stroke-width="3"/>
    <rect x="322" y="234" width="72" height="32" rx="6" fill="#ffe94d" stroke="#141414" stroke-width="3"/>
    <circle cx="336" cy="270" r="12" fill="#141414"/><circle cx="336" cy="270" r="4" fill="#f4efe6"/>
    <circle cx="382" cy="270" r="12" fill="#141414"/><circle cx="382" cy="270" r="4" fill="#f4efe6"/>
    <rect x="394" y="192" width="10" height="90" fill="#141414"/>
    <line x1="399" y1="196" x2="399" y2="278" stroke="#f4efe6" stroke-width="2"/>
    <rect x="404" y="275" width="46" height="7" fill="#141414"/>
    <rect x="410" y="241" width="36" height="34" fill="#e9c27e" stroke="#141414" stroke-width="3"/>
    <line x1="428" y1="243" x2="428" y2="273" stroke="#ff3d8a" stroke-width="4"/>
  </g>
</svg>
